<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3 в ряд - Игра</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
        }

        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 450px;
        }

        .score-section, .moves-section {
            text-align: center;
        }

        .score-label, .moves-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .score-value, .moves-value {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
        }

        .donate-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(240, 147, 251, 0.4);
            transition: all 0.3s ease;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .donate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(240, 147, 251, 0.6);
        }

        .donate-btn:active {
            transform: translateY(-1px);
        }

        .donate-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            animation: fadeIn 0.3s ease;
        }

        .donate-modal.show {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .donate-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 350px;
            width: 90%;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .donate-title {
            font-size: 26px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
        }

        .donate-description {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
            text-align: center;
        }

        .donate-options {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .donate-option {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .donate-option:active {
            transform: scale(0.98);
        }

        .donate-option .amount {
            font-size: 20px;
        }

        .donate-option .bonus {
            font-size: 12px;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 8px;
            border-radius: 8px;
        }

        .close-modal {
            background: #f0f0f0;
            color: #666;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }

        .close-modal:active {
            transform: scale(0.98);
            background: #e0e0e0;
        }

        .game-board {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 5px;
            background: #f0f0f0;
            padding: 10px;
            border-radius: 15px;
            width: 100%;
            aspect-ratio: 1;
        }

        .cell {
            aspect-ratio: 1;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            user-select: none;
            position: relative;
        }

        .cell:active {
            transform: scale(0.95);
        }

        .cell.selected {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.8);
            z-index: 10;
        }

        .cell.swapping {
            animation: swap 0.4s ease;
            z-index: 5;
        }

        @keyframes swap {
            0% { transform: translate(0, 0); }
            50% { transform: scale(1.1); }
            100% { transform: translate(var(--swap-x), var(--swap-y)); }
        }

        .cell.matched {
            animation: match 0.5s ease forwards;
        }

        @keyframes match {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.4) rotate(180deg); opacity: 0.8; }
            100% { transform: scale(0) rotate(360deg); opacity: 0; }
        }

        .cell.falling {
            animation: fall 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes fall {
            from {
                transform: translateY(calc(-100% * var(--fall-distance))) scale(0.8);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        /* Уникальные формы для каждого типа кристалла */

        /* Кристалл 0 - Розовый ромб */
        .gem-0 {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            clip-path: polygon(50% 0%, 85% 35%, 85% 65%, 50% 100%, 15% 65%, 15% 35%);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.3);
        }

        /* Кристалл 1 - Синий круг */
        .gem-1 {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 50%;
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.3);
        }

        /* Кристалл 2 - Зеленый шестиугольник */
        .gem-2 {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            clip-path: polygon(30% 0%, 70% 0%, 100% 50%, 70% 100%, 30% 100%, 0% 50%);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.3);
        }

        /* Кристалл 3 - Желтый квадрат с закругленными углами */
        .gem-3 {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            border-radius: 20%;
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.3);
        }

        /* Кристалл 4 - Фиолетовый пятиугольник */
        .gem-4 {
            background: linear-gradient(135deg, #30cfd0 0%, #330867 100%);
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.3);
        }

        /* Кристалл 5 - Розово-голубая звезда */
        .gem-5 {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .game-over {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .game-over.show {
            display: flex;
        }

        .game-over-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 300px;
        }

        .game-over-title {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 20px;
        }

        .game-over-score {
            font-size: 24px;
            margin-bottom: 30px;
            color: #333;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .combo {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            pointer-events: none;
            opacity: 0;
            z-index: 999;
        }

        .combo.show {
            animation: comboAnim 1s ease;
        }

        @keyframes comboAnim {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="score-section">
                <div class="score-label">Score</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="moves-section">
                <div class="moves-label">Moves</div>
                <div class="moves-value" id="moves">30</div>
            </div>
        </div>
        <div class="game-board">
            <div class="board" id="board"></div>
        </div>
    </div>

    <div class="game-over" id="gameOver">
        <div class="game-over-content">
            <div class="game-over-title">Game Over!</div>
            <div class="game-over-score">
                Your score: <span id="finalScore">0</span>
            </div>
            <button class="btn" onclick="restartGame()">New Game</button>
            <button class="btn" onclick="openDonateFromGameOver()" style="margin-top: 10px; background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                ⭐ Get More Moves
            </button>
        </div>
    </div>

    <div class="combo" id="combo"></div>

    <button class="donate-btn" onclick="openDonateModal()">
        ⭐ Support
    </button>

    <div class="donate-modal" id="donateModal">
        <div class="donate-content">
            <div class="donate-title">⭐ Get More Moves</div>
            <div class="donate-description">
                Support the game and get extra moves!
            </div>
            <div class="donate-options">
                <button class="donate-option" onclick="donate(10)">
                    <span class="amount">⭐ 10 Stars</span>
                    <span class="bonus">+5 moves</span>
                </button>
                <button class="donate-option" onclick="donate(50)">
                    <span class="amount">⭐ 50 Stars</span>
                    <span class="bonus">+30 moves</span>
                </button>
                <button class="donate-option" onclick="donate(100)">
                    <span class="amount">⭐ 100 Stars</span>
                    <span class="bonus">+75 moves</span>
                </button>
                <button class="donate-option" onclick="donate(250)">
                    <span class="amount">⭐ 250 Stars</span>
                    <span class="bonus">+200 moves</span>
                </button>
            </div>
            <button class="close-modal" onclick="closeDonateModal()">Close</button>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Константы игры
        const BOARD_SIZE = 8;
        const GEM_TYPES = 6;
        const INITIAL_MOVES = 30;

        // Состояние игры
        let board = [];
        let score = 0;
        let moves = INITIAL_MOVES;
        let selectedCell = null;
        let isAnimating = false;
        let combo = 0;

        // Инициализация доски
        function initBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            board = [];

            for (let row = 0; row < BOARD_SIZE; row++) {
                board[row] = [];
                for (let col = 0; col < BOARD_SIZE; col++) {
                    let gemType;
                    do {
                        gemType = Math.floor(Math.random() * GEM_TYPES);
                    } while (wouldCreateMatch(row, col, gemType));

                    board[row][col] = gemType;
                    const cell = createCell(row, col, gemType);
                    boardElement.appendChild(cell);
                }
            }
        }

        // Проверка, создаст ли гем совпадение при размещении
        function wouldCreateMatch(row, col, gemType) {
            // Проверка горизонтали
            let count = 1;
            if (col >= 2 && board[row][col - 1] === gemType && board[row][col - 2] === gemType) {
                return true;
            }
            // Проверка вертикали
            if (row >= 2 && board[row - 1][col] === gemType && board[row - 2][col] === gemType) {
                return true;
            }
            return false;
        }

        // Создание ячейки
        function createCell(row, col, gemType) {
            const cell = document.createElement('div');
            cell.className = `cell gem-${gemType}`;
            cell.dataset.row = row;
            cell.dataset.col = col;
            cell.addEventListener('click', () => handleCellClick(row, col));
            return cell;
        }

        // Обработка клика по ячейке
        function handleCellClick(row, col) {
            if (isAnimating || moves <= 0) return;

            const cell = getCellElement(row, col);

            if (!selectedCell) {
                selectedCell = { row, col };
                cell.classList.add('selected');
            } else {
                const prevCell = getCellElement(selectedCell.row, selectedCell.col);
                prevCell.classList.remove('selected');

                if (isAdjacent(selectedCell.row, selectedCell.col, row, col)) {
                    swapGems(selectedCell.row, selectedCell.col, row, col);
                } else {
                    selectedCell = { row, col };
                    cell.classList.add('selected');
                }
            }
        }

        // Проверка соседства
        function isAdjacent(row1, col1, row2, col2) {
            return (Math.abs(row1 - row2) === 1 && col1 === col2) ||
                   (Math.abs(col1 - col2) === 1 && row1 === row2);
        }

        // Обмен гемов
        async function swapGems(row1, col1, row2, col2) {
            isAnimating = true;

            const cell1 = getCellElement(row1, col1);
            const cell2 = getCellElement(row2, col2);

            // Вычисляем направление swap
            const deltaRow = row2 - row1;
            const deltaCol = col2 - col1;
            const cellSize = cell1.offsetWidth + 5; // размер ячейки + gap

            // Устанавливаем CSS переменные для анимации
            cell1.style.setProperty('--swap-x', `${deltaCol * cellSize}px`);
            cell1.style.setProperty('--swap-y', `${deltaRow * cellSize}px`);
            cell2.style.setProperty('--swap-x', `${-deltaCol * cellSize}px`);
            cell2.style.setProperty('--swap-y', `${-deltaRow * cellSize}px`);

            // Добавляем класс анимации
            cell1.classList.add('swapping');
            cell2.classList.add('swapping');

            // Обмен в массиве
            [board[row1][col1], board[row2][col2]] = [board[row2][col2], board[row1][col1]];

            // Ждем окончания анимации
            await new Promise(resolve => setTimeout(resolve, 400));

            // Убираем анимацию и обновляем визуал
            cell1.classList.remove('swapping');
            cell2.classList.remove('swapping');
            updateCellType(row1, col1, board[row1][col1]);
            updateCellType(row2, col2, board[row2][col2]);

            // Проверка совпадений
            const matches = findMatches();

            if (matches.length > 0) {
                moves--;
                updateMoves();
                selectedCell = null;
                combo = 0;
                await processMatches();
            } else {
                // Отмена обмена если нет совпадений
                [board[row1][col1], board[row2][col2]] = [board[row2][col2], board[row1][col1]];
                updateCellType(row1, col1, board[row1][col1]);
                updateCellType(row2, col2, board[row2][col2]);
                selectedCell = null;
            }

            isAnimating = false;

            // Проверка конца игры
            if (moves <= 0) {
                setTimeout(gameOver, 500);
            }
        }

        // Обновление типа ячейки
        function updateCellType(row, col, gemType) {
            const cell = getCellElement(row, col);
            cell.className = `cell gem-${gemType}`;
        }

        // Получение элемента ячейки
        function getCellElement(row, col) {
            return document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
        }

        // Поиск совпадений
        function findMatches() {
            const matches = new Set();

            // Горизонтальные совпадения
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE - 2; col++) {
                    const gemType = board[row][col];
                    if (gemType === board[row][col + 1] && gemType === board[row][col + 2]) {
                        matches.add(`${row},${col}`);
                        matches.add(`${row},${col + 1}`);
                        matches.add(`${row},${col + 2}`);
                    }
                }
            }

            // Вертикальные совпадения
            for (let col = 0; col < BOARD_SIZE; col++) {
                for (let row = 0; row < BOARD_SIZE - 2; row++) {
                    const gemType = board[row][col];
                    if (gemType === board[row + 1][col] && gemType === board[row + 2][col]) {
                        matches.add(`${row},${col}`);
                        matches.add(`${row + 1},${col}`);
                        matches.add(`${row + 2},${col}`);
                    }
                }
            }

            return Array.from(matches).map(pos => {
                const [row, col] = pos.split(',').map(Number);
                return { row, col };
            });
        }

        // Обработка совпадений
        async function processMatches() {
            let matches = findMatches();

            while (matches.length > 0) {
                combo++;

                // Показать комбо
                if (combo > 1) {
                    showCombo(combo);
                }

                // Анимация удаления
                matches.forEach(({ row, col }) => {
                    const cell = getCellElement(row, col);
                    cell.classList.add('matched');
                });

                // Подсчет очков
                const points = matches.length * 10 * combo;
                score += points;
                updateScore();

                await new Promise(resolve => setTimeout(resolve, 500));

                // Удаление совпадений
                matches.forEach(({ row, col }) => {
                    board[row][col] = -1;
                });

                // Падение гемов
                await dropGems();

                // Заполнение пустых мест
                await fillBoard();

                // Проверка новых совпадений
                matches = findMatches();
            }
        }

        // Падение гемов
        async function dropGems() {
            for (let col = 0; col < BOARD_SIZE; col++) {
                let emptyRow = BOARD_SIZE - 1;
                for (let row = BOARD_SIZE - 1; row >= 0; row--) {
                    if (board[row][col] !== -1) {
                        if (row !== emptyRow) {
                            const fallDistance = emptyRow - row;
                            board[emptyRow][col] = board[row][col];
                            board[row][col] = -1;

                            const cell = getCellElement(emptyRow, col);
                            cell.style.setProperty('--fall-distance', fallDistance);
                            cell.classList.add('falling');
                            updateCellType(emptyRow, col, board[emptyRow][col]);

                            setTimeout(() => cell.classList.remove('falling'), 400);
                        }
                        emptyRow--;
                    }
                }
            }
            await new Promise(resolve => setTimeout(resolve, 450));
        }

        // Заполнение доски
        async function fillBoard() {
            for (let col = 0; col < BOARD_SIZE; col++) {
                let emptyCount = 0;
                for (let row = 0; row < BOARD_SIZE; row++) {
                    if (board[row][col] === -1) {
                        emptyCount++;
                    }
                }

                let currentEmpty = 0;
                for (let row = 0; row < BOARD_SIZE; row++) {
                    if (board[row][col] === -1) {
                        currentEmpty++;
                        const gemType = Math.floor(Math.random() * GEM_TYPES);
                        board[row][col] = gemType;
                        const cell = getCellElement(row, col);

                        // Устанавливаем расстояние падения
                        cell.style.setProperty('--fall-distance', emptyCount - currentEmpty + 1);
                        cell.classList.add('falling');
                        updateCellType(row, col, gemType);
                        setTimeout(() => cell.classList.remove('falling'), 400);
                    }
                }
            }
            await new Promise(resolve => setTimeout(resolve, 450));
        }

        // Показать комбо
        function showCombo(comboCount) {
            const comboElement = document.getElementById('combo');
            comboElement.textContent = `COMBO x${comboCount}!`;
            comboElement.classList.add('show');
            setTimeout(() => comboElement.classList.remove('show'), 1000);
        }

        // Обновление счёта
        function updateScore() {
            document.getElementById('score').textContent = score;
        }

        // Обновление ходов
        function updateMoves() {
            document.getElementById('moves').textContent = moves;
        }

        // Конец игры
        function gameOver() {
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').classList.add('show');

            // Отправка результата в Telegram
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                tg.sendData(JSON.stringify({
                    user_id: tg.initDataUnsafe.user.id,
                    score: score
                }));
            }
        }

        // Перезапуск игры
        function restartGame() {
            score = 0;
            moves = INITIAL_MOVES;
            combo = 0;
            selectedCell = null;
            updateScore();
            updateMoves();
            document.getElementById('gameOver').classList.remove('show');
            initBoard();
        }

        // Запуск игры
        initBoard();

        // API endpoint (замените на ваш URL после деплоя на Vercel)
        const API_URL = 'https://f1champ-tg-game.vercel.app/api';

        // Открыть модальное окно доната
        function openDonateModal() {
            document.getElementById('donateModal').classList.add('show');
        }

        // Открыть модальное окно доната из game over
        function openDonateFromGameOver() {
            document.getElementById('gameOver').classList.remove('show');
            document.getElementById('donateModal').classList.add('show');
        }

        // Закрыть модальное окно доната
        function closeDonateModal() {
            document.getElementById('donateModal').classList.remove('show');
        }

        // Обработка доната
        async function donate(stars) {
            try {
                closeDonateModal();

                // Показываем индикатор загрузки
                tg.MainButton.setText('Creating payment...');
                tg.MainButton.show();

                // Получаем данные пользователя
                const userId = tg.initDataUnsafe?.user?.id;
                if (!userId) {
                    tg.showAlert('Error: Failed to get user data');
                    tg.MainButton.hide();
                    return;
                }

                // Запрос на создание invoice
                const response = await fetch(`${API_URL}/create-invoice`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        userId: userId,
                        stars: stars,
                        initData: tg.initData
                    })
                });

                if (!response.ok) {
                    throw new Error('Payment creation failed');
                }

                const data = await response.json();
                tg.MainButton.hide();

                // Открываем форму оплаты
                tg.openInvoice(data.invoiceLink, (status) => {
                    if (status === 'paid') {
                        // Платеж успешен - добавляем бонусы
                        handleSuccessfulPayment(stars);
                    } else if (status === 'cancelled') {
                        tg.showAlert('Payment cancelled');
                    } else if (status === 'failed') {
                        tg.showAlert('Payment failed');
                    }
                });

            } catch (error) {
                console.error('Donation error:', error);
                tg.showAlert('An error occurred. Please try again later.');
                tg.MainButton.hide();
            }
        }

        // Обработка успешного платежа
        function handleSuccessfulPayment(stars) {
            let bonusMoves = 0;

            // Определяем бонус в зависимости от суммы
            switch(stars) {
                case 10:
                    bonusMoves = 5;
                    break;
                case 50:
                    bonusMoves = 30;
                    break;
                case 100:
                    bonusMoves = 75;
                    break;
                case 250:
                    bonusMoves = 200;
                    break;
            }

            // Добавляем бонусные ходы
            moves += bonusMoves;
            updateMoves();

            // Сохраняем в localStorage
            try {
                const saved = localStorage.getItem('totalDonated') || 0;
                localStorage.setItem('totalDonated', parseInt(saved) + stars);
            } catch (e) {
                console.error('localStorage error:', e);
            }

            // Показываем благодарность
            tg.showAlert(`Thank you for your support! ❤️\n\nYou received +${bonusMoves} moves!`);

            // Небольшой визуальный эффект
            const movesElement = document.getElementById('moves');
            movesElement.style.transform = 'scale(1.3)';
            movesElement.style.color = '#f093fb';
            setTimeout(() => {
                movesElement.style.transform = 'scale(1)';
                movesElement.style.color = '#667eea';
            }, 500);
        }

        // Закрытие модалки по клику вне её
        document.getElementById('donateModal').addEventListener('click', (e) => {
            if (e.target.id === 'donateModal') {
                closeDonateModal();
            }
        });
    </script>
</body>
</html>
